# Degoog + degoog-mcp sidecar.
# Good for: exposing Degoog to LLMs / MCP clients (Claude, Cursor, llama.cpp, ...)
# alongside the normal web UI. The sidecar reaches the aggregator internally
# over the shared network at http://degoog:4444.
#
# Setup:
#   mkdir -p ./data ./mcp-data && sudo chown -R 1000:1000 ./data
#   docker compose -f docker-compose-examples/mcp.yml up -d
#
# MCP endpoint: http://localhost:4443/mcp
#
# On first run the sidecar writes its config to ./mcp-data/mcp.yml. Every
# setting lives there, see https://github.com/degoog-org/mcp/blob/main/docs/SETTINGS.md
#
# Tips for small-context models (e.g. llama.cpp), set in ./mcp-data/mcp.yml:
#   search.maxResults caps how many merged results the search tool returns.
#   search.textMode: full puts titles, URLs, and snippets in the visible tool
#   text for clients that do not expose structuredContent.
#   output.mode: compact keeps every tool response short.

services:
  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    volumes:
      - ./data:/app/data
    ports:
      - "4444:4444"
    networks: [degoog-net]
    restart: unless-stopped
    environment:
      # Leave both unset only for trusted local/LAN use. If this instance is
      # reachable from the internet, SET A PASSWORD: an unlocked instance lets
      # anyone install extensions, which runs code on the server.
      DEGOOG_SETTINGS_PASSWORDS: "changeme"
      # When "true", every admin and store action stays behind the password
      # above even on a local network.
      DEGOOG_PUBLIC_INSTANCE: "false"
      # Behind a reverse proxy, set this to the public URL so links such as
      # /opensearch.xml use https.
      # DEGOOG_BASE_URL: "https://search.example.com"

  degoog-mcp:
    image: ghcr.io/degoog-org/mcp:latest
    depends_on:
      - degoog
    ports:
      - "4443:4443"
    volumes:
      - ./mcp-data:/data
    networks: [degoog-net]
    restart: unless-stopped
    environment:
      DEGOOG_MCP_DEGOOG_URL: "http://degoog:4444"
      # If Degoog has API-key protection enabled, set the 64-char hex key here.
      DEGOOG_MCP_DEGOOG_API_KEY: ""
      # Set this before exposing the sidecar beyond localhost. Clients then send
      # it as a bearer token on /mcp.
      DEGOOG_MCP_AUTH_TOKEN: ""

networks:
  degoog-net:
    driver: bridge
