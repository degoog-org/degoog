<div id="app">
  <div id="header">
    <div class="header-right">
      <a
        href="__NOJS_SETTINGS__"
        class="header-link"
        title="{{t:index-templates.header.settings-title}}"
      >
        <i class="fa-solid fa-gear fa-xl"></i>
      </a>
    </div>
  </div>
  <div id="main-home">
    <div id="home-logo">
      <h1 class="logo">
        <span class="logo-d logo-letter nojs-logo-letter">d</span>
        <span class="logo-e logo-letter nojs-logo-letter">e</span>
        <span class="logo-g1 logo-letter nojs-logo-letter">g</span>
        <span class="logo-o1 logo-letter nojs-logo-letter">0</span>
        <span class="logo-o2 logo-letter nojs-logo-letter">0</span>
        <span class="logo-g2 logo-letter nojs-logo-letter">g</span>
      </h1>
    </div>
    <div id="home-search">
      <form
        action="__NOJS_SEARCH_ACTION__"
        method="__NOJS_METHOD__"
        id="search-form-home"
        class="search-form"
        role="search"
      >
        <div class="search-bar degoog-search-bar" id="search-bar-home">
          <svg
            class="search-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9aa0a6"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          <label class="nojs-sr-only" for="search-input"
            >{{t:nojs.search-label}}</label
          >
          <input
            type="text"
            class="search-input"
            id="search-input"
            name="q"
            autocomplete="off"
            autofocus
          />
        </div>
        <div class="button-row">
          <button type="submit" class="search-btn" id="btn-search">
            {{t:index-templates.search.search-button}}
          </button>
        </div>
      </form>
    </div>
  </div>
  <div id="home-footer">__NOJS_FOOTER__</div>
</div>
