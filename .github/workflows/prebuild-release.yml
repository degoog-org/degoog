name: Build and Release Prebuilt Tarball

on:
  push:
    tags: ["*"]

jobs:
  build-prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup the best engine ever
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bake Degoog
        env:
          NODE_ENV: production
        run: bun run build

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Structure the prebuild stuff
        run: |
          mkdir -p prebuild-release/degoog
          cp package.json bun.lock* prebuild-release/degoog/
          cd prebuild-release/degoog && bun install --frozen-lockfile --production && cd ../..
          cp -r src tsconfig.json prebuild-release/degoog/

      - name: Update locale progress image in source branch
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            branch=main
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            branch=develop
          else
            echo "Release commit is not contained in main or develop; cannot safely update the image."
            exit 1
          fi

          git checkout -B "$branch" "origin/$branch"
          bun run scripts/generate-locale-progress.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/locales-progress.svg

          if git diff --cached --quiet; then
            echo "Locale progress image is already up to date."
            exit 0
          fi

          git commit -m "Update locale translation progress image"
          git push origin "HEAD:$branch"

      - name: Create tarball - tarball is a funny name
        run: |
          cd prebuild-release
          tar -czf degoog_${{ steps.version.outputs.version }}_prebuild.tar.gz degoog
          sha256sum degoog_${{ steps.version.outputs.version }}_prebuild.tar.gz > degoog_${{ steps.version.outputs.version }}_prebuild.tar.gz.sha256

      - name: Attach to Release - pray it works
        uses: softprops/action-gh-release@v1
        with:
          files: |
            prebuild-release/degoog_*_prebuild.tar.gz
            prebuild-release/degoog_*_prebuild.tar.gz.sha256
          tag_name: ${{ steps.version.outputs.version }}
